name: Compile LaTeX 2025

# trigger: push to the main branch, or a pull request
on: [push, pull_request]

jobs:
  build_latex:
    runs-on: ubuntu-latest # run on the latest Ubuntu runner
    steps:
      # step 1: check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # step 2: use the community LaTeX action (full TeX Live)
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: neuro/kbs
          root_file: NeuroSLAM_KBS.tex   # main file is NeuroSLAM_KBS.tex
          texlive_version: 2025       # keep the TeX Live version used for the submitted PDF
          latexmk_use_xelatex: true   # keep XeLaTeX, which handles the wide character set and packages used here
          compiler: latexmk     
          args: -interaction=nonstopmode -file-line-error # do not stop on the first error; print diagnostics and continue

      # # step 3: archive the generated PDF as a run artifact
      # # note: this does not commit the PDF into the repository
      # # it is attached to the workflow run page instead, for download and preview.
      # - name: Upload PDF as artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: compiled-neuroslam-kbs
      #     path: neuro/kbs/NeuroSLAM_KBS.pdf